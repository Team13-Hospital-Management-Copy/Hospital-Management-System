services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - hms-db:/app/data
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:////app/data/hms.db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  hms-db:
